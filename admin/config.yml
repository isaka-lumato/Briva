backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "images/projects"
public_folder: "images/projects"

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    description: "Manage Briva mining and exploration projects"
    files:
      - name: "projects_data"
        label: "All Projects"
        file: "data/projects.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{fields.title}} — {{fields.location}}"
            fields:
              - {label: "Project ID", name: "id", widget: "string", hint: "URL-friendly ID (e.g., lithium-dodoma)"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Location", name: "location", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Images", name: "images", widget: "list", field: {label: "Image Path", name: "image", widget: "image"}}
              - {label: "Client", name: "client", widget: "string"}
              - {label: "Size", name: "size", widget: "string"}
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Categories", name: "categories", widget: "string", hint: "Comma-separated (e.g., Exploration, Mining, Mapping)"}
              - {label: "Featured on Homepage", name: "featured", widget: "boolean", default: false, required: false}

  - name: "site_settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General Settings"
        file: "data/site-settings.json"
        fields:
          - {label: "Site Title", name: "site_title", widget: "string", default: "Briva Exploration & Mining"}
          - {label: "Contact Email", name: "contact_email", widget: "string", default: "info@briva.co.tz"}
          - {label: "Contact Phone", name: "contact_phone", widget: "string", default: "+255 767 413 950"}
          - {label: "Address", name: "address", widget: "string", default: "11259 Dar Es Salaam - TZ"}
          - {label: "Instagram URL", name: "instagram_url", widget: "string", required: false}
